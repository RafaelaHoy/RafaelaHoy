name: Radar Cron Worker

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

jobs:
  run-radar:
    name: Sincronizar Radar de Noticias
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Trigger Radar Cron Endpoint
        env:
          SITE_URL: ${{ secrets.SITE_URL || 'https://rafaelahoy.com' }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          TARGET_URL="${SITE_URL%/}/api/cron/radar"
          echo "Disparando Radar en: $TARGET_URL"

          RESPONSE=$(curl -sS -w "\nHTTP_STATUS:%{http_code}" -X GET \
            -H "Authorization: Bearer $CRON_SECRET" \
            -H "User-Agent: GitHubActions-RadarCron/1.0" \
            "$TARGET_URL")

          HTTP_STATUS=$(echo "$RESPONSE" | grep "HTTP_STATUS" | cut -d':' -f2)
          BODY=$(echo "$RESPONSE" | sed -e '/HTTP_STATUS/d')

          echo "Código HTTP recibido: $HTTP_STATUS"
          echo "Respuesta: $BODY"

          if [ "$HTTP_STATUS" -ne 200 ]; then
            echo "Error: La ejecución del radar falló con status $HTTP_STATUS"
            exit 1
          fi
